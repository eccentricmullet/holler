<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>React to a pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#178A35}a:hover{color:#11702A}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Rubik', sans-serif; color: #1A1D24; display: flex; flex-direction: column; padding: 24px 24px 24px; box-sizing: border-box">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="GreenPro.dc.html" aria-label="Back" style="width: 46px; height: 46px; border-radius: 16px; background: #F1F2F0; display: flex; align-items: center; justify-content: center; color: #1A1D24">
<svg viewBox="0 0 24 24" width="22" height="22" class="ic" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<span style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border-radius: 999px; background: #F1F2F0; font-size: 14px; font-weight: 600">
<span style="width: 28px; height: 28px; border-radius: 50%; background: #2F9E44; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="15" height="15" class="ic" aria-hidden="true"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"></path><path d="M5 19l7-7"></path></svg></span>
Greenway Lawn Care</span>
</div>

<h1 style="margin: 36px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">How was<br>Greenway?</h1>
<p style="margin: 10px 0 0; font-size: 16px; color: #6B7079; line-height: 1.4">One tap. Your neighbors see it on the map.</p>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 28px">
<sc-if value="{{ isUp }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="true" onClick="{{ pickUp }}" style="display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 24px; border: 2.5px solid #2BB24C; background: #F1FBEA; font-family: inherit; color: #1A1D24; text-align: left">
<span style="width: 64px; height: 64px; border-radius: 20px; background: #FFFFFF; font-size: 34px; line-height: 64px; text-align: center; flex-shrink: 0">👍</span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 19px; font-weight: 700">Thumbs up</span><span style="font-size: 14px; color: #6B7079">Good work. I'd hire them again.</span></span>
</button>
<button type="button" aria-pressed="false" onClick="{{ pickLove }}" style="display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 24px; border: 2.5px solid #EEEFED; background: #FFFFFF; font-family: inherit; color: #1A1D24; text-align: left">
<span style="width: 64px; height: 64px; border-radius: 20px; background: #FFF0F2; font-size: 34px; line-height: 64px; text-align: center; flex-shrink: 0">❤️</span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 19px; font-weight: 700">Love them</span><span style="font-size: 14px; color: #6B7079">Awesome. I tell everyone about them.</span></span>
</button>
</sc-if>
<sc-if value="{{ isLove }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="false" onClick="{{ pickUp }}" style="display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 24px; border: 2.5px solid #EEEFED; background: #FFFFFF; font-family: inherit; color: #1A1D24; text-align: left">
<span style="width: 64px; height: 64px; border-radius: 20px; background: #F1FBEA; font-size: 34px; line-height: 64px; text-align: center; flex-shrink: 0">👍</span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 19px; font-weight: 700">Thumbs up</span><span style="font-size: 14px; color: #6B7079">Good work. I'd hire them again.</span></span>
</button>
<button type="button" aria-pressed="true" onClick="{{ pickLove }}" style="display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 24px; border: 2.5px solid #E5486A; background: #FFF0F2; font-family: inherit; color: #1A1D24; text-align: left">
<span style="width: 64px; height: 64px; border-radius: 20px; background: #FFFFFF; font-size: 34px; line-height: 64px; text-align: center; flex-shrink: 0">❤️</span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 19px; font-weight: 700">Love them</span><span style="font-size: 14px; color: #6B7079">Awesome. I tell everyone about them.</span></span>
</button>
</sc-if>
</div>

<label for="react-note" style="margin-top: 26px; font-size: 15px; font-weight: 600">Add a quick note <span style="font-weight: 400; color: #6B7079">optional</span></label>
<textarea id="react-note" rows="2" placeholder="What made them good?" style="margin-top: 8px; border: 0; border-radius: 18px; background: #F1F2F0; padding: 14px 16px; font-family: inherit; font-size: 16px; color: #1A1D24; resize: none"></textarea>

<a href="GreenDone.dc.html" style="margin-top: auto; height: 58px; border-radius: 20px; background: #178A35; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 17px; text-decoration: none">Put it on the map</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { pick: 'up' };
}
renderVals() {
const up = this.state.pick === 'up';
return {
isUp: up,
isLove: !up,
pickUp: () => this.setState({ pick: 'up' }),
pickLove: () => this.setState({ pick: 'love' })
};
}
}
</script>
</body>
</html>
