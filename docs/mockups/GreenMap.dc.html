<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Holler map, green</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#178A35}a:hover{color:#11702A}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rd{fill:none;stroke:#FFFFFF;stroke-linecap:round}
.r1{stroke-width:12}
.r2{stroke-width:6}
.blk{fill:#E7E9E6}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F1F2F0; font-family: 'Rubik', sans-serif; color: #1A1D24">

<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<rect x="0" y="0" width="390" height="844" fill="#F1F2F0"></rect>
<rect class="blk" x="20" y="150" width="90" height="60" rx="6"></rect>
<rect class="blk" x="160" y="120" width="70" height="80" rx="6"></rect>
<rect class="blk" x="270" y="160" width="100" height="50" rx="6"></rect>
<rect class="blk" x="30" y="290" width="70" height="90" rx="6"></rect>
<rect class="blk" x="250" y="300" width="110" height="70" rx="6"></rect>
<rect class="blk" x="150" y="420" width="90" height="60" rx="6"></rect>
<rect class="blk" x="20" y="460" width="80" height="50" rx="6"></rect>
<path class="rd r1" d="M-10 250 L400 228"></path>
<path class="rd r1" d="M132 -10 Q140 300 118 860"></path>
<path class="rd r2" d="M-10 405 L400 390"></path>
<path class="rd r2" d="M245 90 Q262 300 250 560"></path>
<path class="rd r2" d="M20 110 L370 128"></path>
<path class="rd r2" d="M330 100 L345 560"></path>
</svg>

<div style="position: absolute; left: 24px; top: 28px; display: flex; flex-direction: column; gap: 2px">
<button type="button" style="display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; font-family: inherit; color: #1A1D24">
<span style="font-size: 36px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Lawn</span>
<svg viewBox="0 0 24 24" width="22" height="22" class="ic" style="stroke-width: 2.5; margin-top: 4px" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<span style="font-size: 15px; color: #6B7079">Who Wades Grove uses</span>
</div>
<a href="GreenProfile.dc.html" aria-label="My profile" style="position: absolute; right: 20px; top: 28px; width: 48px; height: 48px; border-radius: 16px; background: #1A1D24; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; text-decoration: none; box-shadow: 0 4px 14px rgba(26,29,36,0.10)">Z</a>
<button type="button" aria-label="All categories" style="position: absolute; right: 20px; top: 88px; width: 48px; height: 48px; border-radius: 16px; border: 0; background: #FFFFFF; box-shadow: 0 4px 14px rgba(26,29,36,0.10); display: flex; align-items: center; justify-content: center; color: #1A1D24">
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="7" cy="7" r="2.2" fill="currentColor"></circle><circle cx="17" cy="7" r="2.2" fill="currentColor"></circle><circle cx="7" cy="17" r="2.2" fill="currentColor"></circle><circle cx="17" cy="17" r="2.2" fill="currentColor"></circle></svg>
</button>
<button type="button" aria-label="Switch to satellite" style="position: absolute; right: 20px; top: 148px; width: 48px; height: 48px; border-radius: 16px; border: 0; background: #FFFFFF; box-shadow: 0 4px 14px rgba(26,29,36,0.10); display: flex; align-items: center; justify-content: center; color: #1A1D24">
<svg viewBox="0 0 24 24" width="20" height="20" class="ic" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
</button>
<button type="button" aria-label="Center on my home" style="position: absolute; right: 20px; top: 410px; width: 48px; height: 48px; border-radius: 16px; border: 0; background: #FFFFFF; box-shadow: 0 4px 14px rgba(26,29,36,0.10); display: flex; align-items: center; justify-content: center; color: #1A1D24">
<svg viewBox="0 0 24 24" width="22" height="22" class="ic" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
</button>

<a href="GreenFind.dc.html" aria-label="React to a pro you use" style="position: absolute; right: 20px; top: 470px; width: 56px; height: 56px; border-radius: 20px; background: #178A35; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(23,138,53,0.35); z-index: 6"><svg viewBox="0 0 24 24" width="26" height="26" class="ic" style="stroke-width: 2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
<div aria-label="Your home" role="img" style="position: absolute; left: 174px; top: 336px; width: 40px; height: 40px; border-radius: 50%; background: #1A1D24; color: #FFFFFF; border: 3px solid #FFFFFF; box-shadow: 0 0 0 4px #2BB24C, 0 4px 10px rgba(26,29,36,0.25); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-sizing: border-box">Z</div>

<sc-for list="{{ badges }}" as="b" hint-placeholder-count="12">
<button type="button" aria-label="{{ b.label }}" onClick="{{ b.pick }}" style="position: absolute; left: {{ b.x }}px; top: {{ b.y }}px; width: 42px; height: 42px; border-radius: 50%; border: 3px solid #FFFFFF; background: {{ b.bg }}; padding: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; box-shadow: {{ b.ring }}; opacity: {{ b.op }}; z-index: {{ b.z }}">
<sc-if value="{{ b.gw }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="20" height="20" class="ic" aria-hidden="true"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"></path><path d="M5 19l7-7"></path></svg></sc-if>
<sc-if value="{{ b.tb }}" hint-placeholder-val="{{ false }}">2B</sc-if>
<sc-if value="{{ b.rh }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="20" height="20" class="ic" aria-hidden="true"><path d="M2 18l6-7 4 4 3-3 7 6"></path><circle cx="17" cy="7" r="2"></circle></svg></sc-if>
<sc-if value="{{ b.love }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: -9px; top: -9px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; font-size: 13px; line-height: 24px; text-align: center; box-shadow: 0 2px 5px rgba(26,29,36,0.18)">❤️</span></sc-if>
</button>
</sc-for>

<div style="position: absolute; left: 20px; bottom: 28px; display: flex; gap: 14px; align-items: flex-end">
<div style="width: 236px; height: 252px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(26,29,36,0.14); position: relative; overflow: hidden; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column">
<span aria-hidden="true" style="position: absolute; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: #2BB24C"></span>
<span aria-hidden="true" style="position: absolute; right: -10px; top: -90px; width: 150px; height: 150px; border-radius: 50%; background: #7ED957"></span>
<span style="position: relative; width: 56px; height: 56px; border-radius: 50%; background: #2F9E44; border: 3px solid #FFFFFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(26,29,36,0.15)">
<svg viewBox="0 0 24 24" width="26" height="26" class="ic" aria-hidden="true"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"></path><path d="M5 19l7-7"></path></svg>
</span>
<span style="position: relative; margin-top: 18px; font-size: 20px; font-weight: 700; line-height: 1.15">Greenway Lawn Care</span>
<span style="position: relative; margin-top: 8px; display: flex; gap: 12px; font-size: 16px; font-weight: 600">
<span>👍 9</span><span>❤️ 4</span><span style="color: #6B7079; font-weight: 500; font-size: 14px; align-self: center">7 on map</span>
</span>
<span style="margin-top: auto; display: flex; gap: 8px">
<a href="#call" style="flex-grow: 1; height: 48px; border-radius: 16px; background: #178A35; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 15px; text-decoration: none">
<svg viewBox="0 0 24 24" width="18" height="18" class="ic" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Call</a>
<a href="GreenPro.dc.html" aria-label="View Greenway Lawn Care" style="width: 48px; height: 48px; border-radius: 16px; background: #F1F2F0; color: #1A1D24; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" class="ic" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
</span>
</div>

<div style="width: 176px; height: 214px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(26,29,36,0.12); padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0">
<span style="width: 48px; height: 48px; border-radius: 50%; background: #D9480F; border: 3px solid #FFFFFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; box-shadow: 0 4px 10px rgba(26,29,36,0.15)">2B</span>
<span style="margin-top: 14px; font-size: 18px; font-weight: 700; line-height: 1.15">Two Brothers Mowing</span>
<span style="margin-top: 8px; display: flex; gap: 10px; font-size: 15px; font-weight: 600"><span>👍 6</span><span>❤️ 1</span></span>
<span style="margin-top: auto; font-size: 13px; color: #6B7079">4 on map</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: 'gw' };
}
renderVals() {
const sel = this.state.sel;
const toggle = (id) => () => this.setState({ sel: this.state.sel === id ? null : id });
const co = {
gw: { name: 'Greenway Lawn Care', bg: '#2F9E44' },
tb: { name: 'Two Brothers Mowing', bg: '#D9480F' },
rh: { name: 'Rolling Hills Landscape', bg: '#6741D9' }
};
const spots = [
['gw', 150, 196, true], ['gw', 210, 264, false], ['gw', 70, 236, true], ['gw', 280, 236, false], ['gw', 96, 328, false], ['gw', 270, 330, true], ['gw', 180, 420, false],
['tb', 300, 150, false], ['tb', 36, 150, false], ['tb', 40, 420, false],
['rh', 200, 130, false], ['rh', 120, 470, false]
];
const shadow = '0 4px 10px rgba(26,29,36,0.25)';
const badges = spots.map((s) => {
const id = s[0];
const on = sel === id;
return {
x: s[1], y: s[2], bg: co[id].bg, love: s[3],
gw: id === 'gw', tb: id === 'tb', rh: id === 'rh',
label: (s[3] ? 'A neighbor loves ' : 'A neighbor uses ') + co[id].name,
op: sel && !on ? 0.3 : 1,
z: on ? 3 : 1,
ring: on ? '0 0 0 3px #2BB24C, ' + shadow : shadow,
pick: toggle(id)
};
});
return { badges: badges };
}
}
</script>
</body>
</html>
